server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /portals/;
    }

    location = /portals {
        return 301 /portals/;
    }

    location = /portals/ {
        alias /usr/share/nginx/html/soca/;
        autoindex on;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~ ^/portals/([^/]+)$ {
        return 301 /portals/$1/;
    }

    location ~ ^/portals/([^/]+)/$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /soca/$1/portal/index.html =404;
    }

    location ~ ^/portals/([^/]+)/(.*\.html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /soca/$1/portal/$2 =404;
    }

    location ~ ^/portals/([^/]+)/(.*)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files /soca/$1/portal/$2 /soca/$1/portal/$2/ =404;
    }

}
