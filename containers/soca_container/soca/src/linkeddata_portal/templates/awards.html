{% extends "base.html" %}

{% block content %}
<div class="jumbotron">
  <h1>{{ page.heading }}</h1>
  <p class="lead">{{ page.lead }}</p>
</div>

<ul>
  {% for award in items %}
  <li style="text-align: justify">
    {{ award.text }}
    {% if award.links %}
      {% for link in award.links %}
      <a href="{{ link.url }}" target="_blank">{{ link.label }}</a>{% if not loop.last %} {% endif %}
      {% endfor %}
    {% endif %}
  </li>
  {% endfor %}
</ul>
{% endblock %}
